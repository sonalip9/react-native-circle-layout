name: Setup
description: Setup Node.js and install dependencies

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4.4.0
      with:
        node-version-file: .nvmrc

    - name: Setup pnpm
      uses: pnpm/action-setup@v2

    - name: Restore dependencies
      id: pnpm-cache
      uses: actions/cache/restore@v4.2.3
      with:
        path: |
          **/node_modules
          ~/.pnpm-store
        # Exact match only: installing over a node_modules tree restored from
        # an older lockfile leaves pnpm's hoisted packages missing.
        key: ${{ runner.os }}-pnpm-v2-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/package.json', '!node_modules/**') }}

    - name: Install dependencies
      if: steps.pnpm-cache.outputs.cache-hit != 'true'
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Cache dependencies
      if: steps.pnpm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4.2.3
      with:
        path: |
          **/node_modules
          ~/.pnpm-store
        key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
